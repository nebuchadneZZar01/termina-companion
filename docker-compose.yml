# Local stack: the TaIA Streamlit app plus the Arize Phoenix tracing backend.
#
# Observability only (the previous behaviour, unchanged):
#
#   docker compose up -d
#   # then set OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:6006 in .env
#
# The app and Phoenix together:
#
#   docker compose --profile app up -d --build
#   # open http://localhost:8501 for TaIA, http://localhost:6006 for Phoenix
#
# The app service reads .env (LLM provider, keys, RAG settings). Container-only
# values are overridden: the OTLP endpoint points at the Phoenix service instead
# of localhost, and the state directories plus the embedding model cache live on
# the termina_data volume. An Ollama/LM Studio server on the host is reachable
# at http://host.docker.internal:11434/v1 (set LLM_BASE_URL accordingly).
#
# Note: Phoenix serves BOTH the web UI and the OTLP/HTTP receiver on :6006 (it
# has no :4318 listener — that port belongs to the generic OTel Collector).
# The app stays fully functional (no-op tracing) when Phoenix is not running.

services:
  app:
    profiles: ["app"]
    build:
      context: .
    image: termina-companion:local
    container_name: termina-app
    env_file:
      # App configuration (LLM_*, LOG_LEVEL, PLANNER, RAG_*): same contract as
      # app/settings.py. Optional, so a fresh clone still boots; see
      # .env.example.
      - path: .env
        required: false
    # Container overrides; Compose gives these precedence over env_file.
    environment:
      RAG_QDRANT_PATH: /data/qdrant # Qdrant store + saves (named volume)
      FASTEMBED_CACHE_PATH: /data/fastembed # embedding model cache
      OTEL_EXPORTER_OTLP_ENDPOINT: http://phoenix:6006
      PHOENIX_BASE_URL: ""
    ports:
      - "${TERMINA_PORT:-8501}:8501"
    volumes:
      - termina_data:/data
    extra_hosts:
      # Lets the container reach an LLM server running on the host.
      - "host.docker.internal:host-gateway"
    depends_on:
      - phoenix
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: termina-phoenix
    ports:
      - "6006:6006" # Phoenix web UI + OTLP/HTTP trace receiver (/v1/traces)
    volumes:
      - phoenix_data:/root/.phoenix
    restart: unless-stopped

volumes:
  termina_data:
  phoenix_data:
