name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

  # Release gate: the deterministic evaluation sweep runs offline (no LLM, no
  # wiki, no credentials), so it can gate every pull request. It covers game
  # data, retrieval, chain reconciliation and the Critic — not the model's own
  # behaviour, which needs the manual LLM sweep.
  eval-gate:
    runs-on: ubuntu-latest
    needs: [ci]
    timeout-minutes: 5
    permissions:
      contents: read

    env:
      PLANNER: deterministic
      RAG_ENABLED: "0"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen

      - name: Eval gate (deterministic, offline)
        env:
          # Keep the report store and the embedded Qdrant path out of the checkout.
          RAG_QDRANT_PATH: ${{ runner.temp }}/termina/qdrant
        run: >-
          uv run python scripts/evaluate_plans.py
          --planner deterministic
          --rag off
          --min-scenarios 12
          --json ${{ runner.temp }}/eval-gate.json

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-gate
          path: ${{ runner.temp }}/eval-gate.json
          if-no-files-found: warn

  image:
    runs-on: ubuntu-latest
    needs: [eval-gate]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push to GHCR on main and version tags

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker tag "$(echo "${{ steps.meta.outputs.tags }}" | head -n1)" termina-companion:ci
          docker run -d --name termina-smoke -p 8501:8501 \
            -e PLANNER=deterministic -e RAG_ENABLED=0 \
            termina-companion:ci
          healthy=""
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health | grep -q ok; then
              healthy=1
              break
            fi
            sleep 2
          done
          docker run --rm -e PLANNER=deterministic -e RAG_ENABLED=0 \
            termina-companion:ci python -m app --deterministic --no-rag
          docker logs termina-smoke || true
          docker rm -f termina-smoke
          test "${healthy}" = 1

      - name: Push image to GHCR
        if: github.event_name == 'push'
        run: echo "${{ steps.meta.outputs.tags }}" | xargs -n1 docker push
