[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "termina-companion"
version = "0.1.0"
description = "Multi-agent temporal planning companion for The Legend of Zelda: Majora's Mask"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain-anthropic>=0.3",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-openai>=0.3",
    "langgraph>=1.0",
    "mcp>=2,<3",
    "pydantic>=2",
    "python-dotenv>=1.0",
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/knowledge/clock_town/*.md"]
